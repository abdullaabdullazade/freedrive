name: Mobile CI

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"
      - ".github/workflows/release-mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"
      - ".github/workflows/release-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/freedrive-mobile-export

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: freedrive-mobile-pr-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
