name: Desktop Release

on:
  push:
    tags:
      - "v[0-9]*"
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
          - platform: macos-14
            args: --bundles app,dmg
    runs-on: ${{ matrix.platform }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      # Tauri's bundled linuxdeploy is too old to exclude host graphics-stack
      # libraries. Bundling Ubuntu's libwayland-client ahead of a newer Mesa
      # causes WebKit to abort with EGL_BAD_PARAMETER and leaves a frozen window.
      - name: Install compatible linuxdeploy
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          LINUXDEPLOY_SHA256: 421ca71d5c69ea97c6309276232990d43df1dcece0edfaa26bbf926ff96ed12e
        run: |
          set -euo pipefail
          tools_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          tool_path="${tools_dir}/linuxdeploy-x86_64.AppImage"
          mkdir -p "${tools_dir}"
          curl -L --fail --show-error --retry 3 \
            -H "Accept: application/octet-stream" \
            -o "${tool_path}" \
            "https://api.github.com/repos/linuxdeploy/linuxdeploy/releases/assets/497463883"
          echo "${LINUXDEPLOY_SHA256}  ${tool_path}" | sha256sum --check --strict
          chmod +x "${tool_path}"
          "${tool_path}" --appimage-extract-and-run --version

      - name: Resolve release tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#desktop-v}"
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Apply tag version to desktop build
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          tmp="$(mktemp)"
          jq --arg version "${RELEASE_VERSION}" '.version = $version' \
            desktop/src-tauri/tauri.conf.json > "${tmp}"
          mv "${tmp}" desktop/src-tauri/tauri.conf.json

      - name: Configure signed updater
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ] || [ -z "${TAURI_UPDATER_PUBLIC_KEY}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tauri signing secrets are absent; publishing unsigned installers without updater metadata."
            exit 0
          fi
          jq -n --arg pubkey "${TAURI_UPDATER_PUBLIC_KEY}" '{
            bundle: {createUpdaterArtifacts: true},
            plugins: {updater: {
              pubkey: $pubkey,
              endpoints: ["https://github.com/abdullaabdullazade/freedrive/releases/latest/download/latest.json"]
            }}
          }' > desktop/src-tauri/updater.release.conf.json
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build and publish signed desktop release
        if: steps.signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUXDEPLOY_EXCLUDED_LIBRARIES: ${{ matrix.platform == 'ubuntu-22.04' && 'libwayland-client.so*' || '' }}
        with:
          projectPath: desktop
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: FreeDrive ${{ steps.vars.outputs.tag }}
          releaseBody: "FreeDrive server, mobile, and desktop release assets."
          releaseDraft: false
          prerelease: ${{ contains(steps.vars.outputs.version, '-') }}
          args: ${{ matrix.args }} --config src-tauri/updater.release.conf.json

      - name: Build and publish unsigned desktop release
        if: steps.signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUXDEPLOY_EXCLUDED_LIBRARIES: ${{ matrix.platform == 'ubuntu-22.04' && 'libwayland-client.so*' || '' }}
        with:
          projectPath: desktop
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: FreeDrive ${{ steps.vars.outputs.tag }}
          releaseBody: "FreeDrive server, mobile, and desktop release assets."
          releaseDraft: false
          prerelease: ${{ contains(steps.vars.outputs.version, '-') }}
          args: ${{ matrix.args }}

      - name: Verify AppImage uses the host Wayland client
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          if [ -z "${appimage}" ]; then
            echo "AppImage was not produced" >&2
            exit 1
          fi
          audit_dir="$(mktemp -d)"
          cp "${appimage}" "${audit_dir}/FreeDrive.AppImage"
          chmod +x "${audit_dir}/FreeDrive.AppImage"
          (
            cd "${audit_dir}"
            ./FreeDrive.AppImage --appimage-extract >/dev/null
            if find squashfs-root/usr/lib -maxdepth 1 -name 'libwayland-client.so*' -print -quit | grep -q .; then
              echo "AppImage still bundles libwayland-client" >&2
              exit 1
            fi
          )
